  <defs>
    <linearGradient id="mhero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#006DAD"/><stop offset="0.5" stop-color="#3087CC"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="mring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C4B6"/><stop offset="1" stop-color="#3087CC"/>
    </linearGradient>
    <linearGradient id="mc1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3087CC"/><stop offset="1" stop-color="#006DAD"/></linearGradient>
    <linearGradient id="mc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF6B6B"/></linearGradient>
