<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
