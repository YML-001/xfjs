      <rect x="309" y="17" width="3" height="9" fill="#1A2A3A"/>
      <rect x="314" y="14" width="3" height="12" fill="#1A2A3A"/>
      <rect x="319" y="11" width="3" height="15" fill="#1A2A3A"/>
